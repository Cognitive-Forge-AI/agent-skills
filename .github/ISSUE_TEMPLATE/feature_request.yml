name: Feature or plugin proposal
description: Propose a focused improvement or a plugin for maintainer review.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Explain who needs this and what they cannot do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the improvement and any alternatives considered. For plugins, include the source, license, supported harnesses, and executable or service components.
    validations:
      required: true
