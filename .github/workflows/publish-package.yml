name: Publish Catalog Package

on:
  push:
    tags: ['catalog-v*']

permissions:
  contents: read

concurrency:
  group: publish-catalog-package
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Check tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(dotnet msbuild tools/AgentSkills.Catalog/AgentSkills.Catalog.csproj -getProperty:Version)
          if [ "catalog-v${version}" != "$TAG" ]; then
            echo "Tag $TAG does not match package version $version." >&2
            exit 1
          fi
      - name: Test
        run: dotnet test tools/AgentSkills.Catalog.Tests/AgentSkills.Catalog.Tests.csproj
      - name: Pack
        run: dotnet pack tools/AgentSkills.Catalog/AgentSkills.Catalog.csproj --configuration Release --output "$RUNNER_TEMP/packages"
      - name: Log in to nuget.org with trusted publishing
        id: nuget
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "$RUNNER_TEMP/packages/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
