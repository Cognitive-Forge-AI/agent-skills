name: Validate Marketplace

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Test catalog library
        run: dotnet test tools/AgentSkills.Catalog.Tests/AgentSkills.Catalog.Tests.csproj
      - name: Validate catalog, packages, and generated views
        run: dotnet run --project tools/AgentSkills.Cli/AgentSkills.Cli.csproj -- validate
