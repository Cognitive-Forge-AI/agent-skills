name: Validate Marketplace

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Test catalog library
        run: dotnet test tools/AgentSkills.Catalog.Tests/AgentSkills.Catalog.Tests.csproj
      - name: Validate catalog, packages, and generated views
        run: dotnet run --project tools/AgentSkills.Cli/AgentSkills.Cli.csproj -- validate
